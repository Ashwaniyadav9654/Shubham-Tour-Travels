<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0c" />

    <!-- Icons: generated from the real Shubham Tour & Travels logo -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- SEO -->
    <title>Shubham Tour &amp; Travels | Tour &amp; Travel Agency in Gurgaon</title>
    <meta name="description" content="Book Tempo Traveller hire, cabs and holiday tour packages from Gurgaon &amp; Delhi NCR. 35 customisable trips, 3–5 star hotels, own fleet, only 10% advance." />
    <meta name="author" content="Shubham Tour &amp; Travels" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://shubhamtourtravels.in/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Shubham Tour &amp; Travels" />
    <meta property="og:title" content="Tempo Traveller &amp; Tour Packages in Gurgaon | Shubham Travels" />
    <meta property="og:description" content="Luxury Tempo Traveller, AC coaches and premium cars across Gurgaon and Delhi NCR. Only 10% advance to confirm." />
    <meta property="og:url" content="https://shubhamtourtravels.in/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://shubhamtourtravels.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Shubham Tour &amp; Travels logo" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tempo Traveller &amp; Tour Packages in Gurgaon | Shubham Travels" />
    <meta name="twitter:description" content="Luxury Tempo Traveller, AC coaches and premium cars across Gurgaon and Delhi NCR." />
    <meta name="twitter:image" content="https://shubhamtourtravels.in/og-image.jpg" />


    <!-- Structured data: tells Google the business and the logo -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "@id": "https://shubhamtourtravels.in/#organization",
      "name": "Shubham Tour & Travels",
      "alternateName": "Shubham Tour and Travels",
      "description": "Luxury Tempo Traveller, AC bus and premium car rental for group travel, corporate accounts, weddings, airport transfers and outstation tours across Gurgaon and Delhi NCR.",
      "url": "https://shubhamtourtravels.in/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://shubhamtourtravels.in/favicon-512x512.png",
        "width": 512,
        "height": 512
      },
      "image": "https://shubhamtourtravels.in/og-image.jpg",
      "telephone": "+918595820300",
      "email": "contact@shubhamtourtravels.in",
      "priceRange": "₹₹",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "5, Ashok Vihar Phase 3 Extn",
        "addressLocality": "Gurugram",
        "addressRegion": "Haryana",
        "postalCode": "122001",
        "addressCountry": "IN"
      },
      "geo": { "@type": "GeoCoordinates", "latitude": 28.4595, "longitude": 77.0266 },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
        "opens": "00:00",
        "closes": "23:59"
      },
      "areaServed": [
        { "@type": "City", "name": "Gurugram" },
        { "@type": "City", "name": "Delhi" },
        { "@type": "City", "name": "Noida" },
        { "@type": "City", "name": "Faridabad" }
      ]
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Shubham Tour & Travels",
      "url": "https://shubhamtourtravels.in/"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
